# Netlify publica la carpeta "tienda" tal cual, sin compilar nada.
[build]
  publish = "tienda"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
